# Dynamic configuration for the Traefik proxy in the dev environment.
# This mirrors the configuration generated by brewblox-ctl.

http:
  routers:
    api:
      rule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      service: api@internal
  middlewares:
    prefix-strip:
      stripPrefixRegex:
        regex:
          - '/[^/]+'
    auth:
      forwardAuth:
        address: http://auth:5000/auth/verify
    cors:
      headers:
        accessControlAllowCredentials: true
        accessControlAllowOriginListRegex:
          - '.*'
        accessControlAllowMethods:
          - CONNECT
          - HEAD
          - GET
          - DELETE
          - OPTIONS
          - PATCH
          - POST
          - PUT
          - TRACE
        accessControlAllowHeaders:
          - Origin
          - X-Requested-With
          - Content-Type
          - Accept

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /config/brew.blox/cert.pem
        keyFile: /config/brew.blox/key.pem

serversTransport:
  rootCAs:
    - /config/minica.pem
