# Static configuration for the Traefik proxy in the dev environment.
# This mirrors the configuration generated by brewblox-ctl,
# but uses dev ports instead of 80/443/9600.
#
# Traefik does not substitute environment variables in this file.
# The docker provider constraint uses the project name set in docker-compose.yml.

api:
  dashboard: true

providers:
  docker:
    constraints: 'LabelRegex(`com.docker.compose.project`, `brewblox-ui`)'
    defaultRule: 'PathPrefix(`/{{ index .Labels "com.docker.compose.service" }}`)'
  file:
    directory: /config/dynamic

entryPoints:
  web:
    address: :9000
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: :9001
    http:
      tls: {}
      middlewares:
        - cors@file
        - auth@file
  admin:
    address: :9601
    http:
      middlewares:
        - cors@file
  mqtt:
    address: :1883/tcp
  mqtts:
    address: :8883/tcp
