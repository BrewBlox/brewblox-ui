<!doctype html>
<html>
  <head>
    <title>Brewblox</title>

    <meta charset="utf-8" />
    <meta
      name="format-detection"
      content="telephone=no"
    />
    <meta
      name="msapplication-tap-highlight"
      content="no"
    />
    <meta
      name="viewport"
      content="
    user-scalable=no,
    initial-scale=1,
    maximum-scale=1,
    minimum-scale=1,
    width=device-width"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <link
      rel="icon"
      type="image/png"
      href="/app-logo-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/ico"
      href="/favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      href="/icons/apple-icon-180x180.png"
    />
  </head>

  <script>
    // A hack for libraries that rely on the Node.JS `global` property.
    var global = global || window;
  </script>

  <body>
    <!-- Shown by the check below in browsers older than the build supports -->
    <div
      id="unsupported-browser"
      hidden
      style="
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 10000;
        padding: 40px 16px;
        text-align: center;
        font-family: sans-serif;
        color: white;
        background: #121212;
      "
    >
      This browser is too old for Brewblox.<br />
      Update it, or open Brewblox in another browser.
    </div>
    <script>
      // The build supports Chrome 87, Safari 14 and Firefox 78 (vite.config.mts).
      // Older browsers show a blank page without this.
      // replaceAll is missing before Chrome 85 and Firefox 77; BigInt before Safari 14.
      if (!('replaceAll' in String.prototype) || typeof BigInt !== 'function') {
        document.getElementById('unsupported-browser').hidden = false;
      }
    </script>
    <!-- Browsers without module support never load the app -->
    <script nomodule>
      document.getElementById('unsupported-browser').hidden = false;
    </script>

    <!-- DO NOT touch the following DIV -->
    <div id="q-app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
